services:
  nebula-backend:
    container_name: nebula-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - SABNZBD_URL=http://192.168.16.2:8080
      - SABNZBD_API_KEY=0fcabfed21484eb6a9a2203f92bb2101
      - PORT=3000
    ports:
      - "3000:3000"

  nebula-frontend:
    container_name: nebula-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - nebula-backend
    environment:
      - VITE_API_URL=/api
    ports:
      - "5173:5173"
